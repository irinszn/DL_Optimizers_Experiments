mlflow:
  experiment_name: "{model_name}_{dataset_name}"  # MLflow experiment name

data:
  dataset_name: "YourDataset"                          # Dataset name
  clean_data_path: "path/to/raw/data"                  # Path to raw images
  preprocessed_root_path: "path/to/preprocessed/data"  # Where to save noisy datasets
  scenario_folder_template: "YourDataset_{scenario_name}" # Template for noisy dataset folder names
  num_classes: 10                                       # Number of classes in the dataset
  num_workers: 2                                         # Number of DataLoader worker processes
  pin_memory: false                                      # Set to true if running on GPU
  debug_subset_size: 100                                 # For quick test runs (can be removed)

model:
  name: "SimpleCNN"   # Model name from MODEL_REGISTRY in run.py
  params:
    num_classes: 10

training:
  epochs: 12
  batch_size: 64
  learning_rate: 0.001
  target_loss: 0.4    # Target loss for convergence time tracking
  criterion: "CrossEntropyLoss"
  num_runs: 3         # Number of runs for averaging results
  save_model_mode: "best"  # best — save best model, all — save all, none — don't save
  early_stopping_patience: 3  # stop if val accuracy doesn't improve for N epochs (0 to disable)

robustness:
  trained_on_scenario: "no_noise"  # Scenario used to train the reference model for robustness evaluation

grid_search:
  optimizers:
    - name: "SGD"     # Optimizer name from OPTIMIZER_REGISTRY in run.py
      params:
        momentum: 0.9
    - name: "Adam"
      params: {}
    # - name: "LAMB"  # Add more optimizers with params as needed
    #   params: {}

  noise_scenarios:
    no_noise: []            # Clean data (required scenario)
    gaussian_0.05:          # Scenario name
      - name: "GaussianNoiseAdder"    # Class name from NOISE_REGISTRY in run.py
        params:
          mean: 0.0
          std: 0.05
    salt_pepper_0.03:
      - name: "SaltAndPepperNoiseAdder"
        params:
          amount: 0.03
